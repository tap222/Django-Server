{% extends 'main.html' %}


{% block head %}
<title>User Dashboard</title>
{% endblock %}


{% block body %}

    <!-- Main Content -->
    <div id="main" class="flex-1 transition-all duration-300 ml-0 lg:ml-64">
      {% include "sidebaruser.html" %}
      {% include "navbar2.html" %}

      <!-- Upcoming Events -->
      <div class="p-6">
        <h2 class="text-2xl font-bold mb-4">Upcoming Events</h2>
        <div
          id="upcomingEvents"
          class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6"
        ></div>
      </div>



    <!-- JavaScript -->
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        // Toggle Sidebar
        const sidebar = document.getElementById("sidebar");
        const openSidebar = document.getElementById("openSidebar");
        const closeSidebar = document.getElementById("closeSidebar");

        openSidebar.addEventListener("click", () => {
          sidebar.classList.remove("-translate-x-full");
        });

        closeSidebar.addEventListener("click", () => {
          sidebar.classList.add("-translate-x-full");
        });

        // Event Data
        const events = [
          {
            title: "Event Name Here",
            description:
              "Here are short description about the event so user can easily know about the event!",
            imgSrc: "./assests/s1.png",
            tag: "3 DAYS LEFT",
          },
          {
            title: "Event Name Here",
            description:
              "Here are short description about the event so user can easily know about the event!",
            imgSrc: "./assests/s2.png",
            tag: "3 DAYS LEFT",
          },
          {
            title: "Event Name Here",
            description:
              "Here are short description about the event so user can easily know about the event!",
            imgSrc: "./assests/s3.png",
            tag: "3 DAYS LEFT",
          },
        ];
        const pastEvents = [
          {
            title: "Event Name Here",
            description:
              "Here are short description about the event so user can easily know about the event!",
            imgSrc: "./assests/s4.png",
            tag: "Closed",
          },
          {
            title: "Event Name Here",
            description:
              "Here are short description about the event so user can easily know about the event!",
            imgSrc: "./assests/s5.png",
            tag: "Closed",
          },
        ];

        // Render Events
        const renderEventCard = (event, showBuyButton) => `
            <div class="bg-white shadow-md rounded-lg p-4">
              <img src="${event.imgSrc}" alt="${
          event.title
        }" class="h-40 w-full rounded-md object-cover">
              <div class="mt-4">
                <div class="flex justify-between items-center">
                  <span class="text-xs text-red-500 uppercase bg-teal-100">${
                    event.tag
                  }</span>
                  ${
                    showBuyButton
                      ? '<button class="text-base text-white bg-teal-500 px-3 py-1 rounded">Buy now</button>'
                      : ""
                  }
                </div>
                <h3 class="text-lg font-semibold mt-2">${event.title}</h3>
                <p class="text-gray-600 mt-1">${event.description}</p>
              </div>
            </div>
          `;

        // Render Upcoming Events with Buy Button
        document.getElementById("upcomingEvents").innerHTML = events
          .map((event) => renderEventCard(event, true))
          .join("");

        // Render Past Events without Buy Button
        document.getElementById("pastEvents").innerHTML = pastEvents
          .map((event) => renderEventCard(event, false))
          .join("");
      });
    </script>
{% endblock %}
