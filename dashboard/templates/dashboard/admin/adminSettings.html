{% extends 'main.html' %}


{% block head %}
<title>Settings</title>
{% endblock %}


{% block body %}

<!-- Main Content -->
<div id="main" class="flex-1 transition-all duration-300 ml-0 lg:ml-64">
  {% include "dashboard/admin/sideBarAdmin.html" %}
  {% include "navbar2.html" %}

  <!-- Account Settings -->
  <div class="p-6">
    <h2 class="text-2xl font-bold mb-4">Account Settings</h2>
    <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6" >
      <div class="mb-4">
        <input type="submit" value="Upload"></div>
        <input type="file" name="file" accept="image/*type="file" 
                id="pictureUpload" 
                name="picture" 
                accept="image/*" 
                hx-post="/dashboard/settings/avatar" 
                hx-trigger="change" 
                hx-encoding="multipart/form-data"
                hx-target="#response" />
        <div id="response"></div>
      </div>
      <div class="mb-4">
        <button class="px-3 py-1 bg-red-500 text-white rounded" role="delete">Delete Account</button>
      </div>
    </div>
  </div>
</div>
{% endblock %}
