<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Instructor</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
  {% load static %}
  {% include 'navbar.html' %}
    <div class="container mx-auto py-8">
      <div
        class="grid grid-cols-1 md:grid-cols-2 gap-8 bg-gray-100 p-6 pt-8 pb-12"
      >
        <div class="flex justify-center md:justify-start">
          <img
            id="instructorImage"
            class="h-auto object-cover max-w-sm"
            src="{% static 'assets/i4.png' %}"
            alt="Instructor Name"
          />
        </div>
        <div class="flex flex-col justify-center">
          <h1 id="instructorName" class="text-3xl font-bold text-gray-800"></h1>
          <p id="instructorTitle" class="text-xl text-gray-600 mt-2"></p>
          <div class="mt-6 text-gray-800 text-lg leading-relaxed">
            <p id="instructorDescription"></p>
          </div>
        </div>
      </div>

      <!-- Reviews Section -->
      <div class="py-12 px-8">
        <h2 class="text-3xl font-bold text-green-600 mb-6">Reviews</h2>
        <div id="reviewsContainer" class="space-y-6"></div>

        <!-- Show All Button -->
        <div id="showAllButtonContainer" class="text-center mt-6 hidden">
          <button
            onclick="showAllReviews()"
            class="px-4 py-2 bg-teal-500 text-white rounded-lg hover:bg-teal-600"
          >
            Show All Reviews
          </button> 
        </div>
      </div>
    </div>

      {% include 'footer.html' %}

    <script>
      function toggleMenu() {
        const menu = document.getElementById("menu");
        const menuIcon = document.getElementById("menuIcon");

        const isOpen = menu.classList.contains("hidden");
        if (isOpen) {
          menu.classList.remove("hidden");
          menu.classList.add("block", "shadow-lg", "py-4");
          menuIcon.classList.remove("fa-bars");
          menuIcon.classList.add("fa-times");
        } else {
          menu.classList.remove("block", "shadow-lg", "py-4");
          menu.classList.add("hidden");
          menuIcon.classList.remove("fa-times");
          menuIcon.classList.add("fa-bars");
        }
      }

      const instructor = {
        image: "{% static 'assets/i4.png' %}",
        name: "Albert Flores",
        title: "Adobe Instructor",
        description:
          "is an experienced online coach and Discord server expert, with over [X] years of hands-on experience in growing and managing thriving communities on Discord. Specializing in community engagement, server optimization, and growth strategies, [Teacher's Name] has helped countless server owners maximize their potential. With a passion for teaching and a deep understanding of Discord’s unique features, they provide clear, actionable insights in each course. Their approach combines technical knowledge with practical strategies to ensure that every student can build and scale a successful Discord community. Whether you're just starting or looking to optimize your server, [Teacher's Name] offers personalized guidance to meet your needs. Get ready to learn from a true professional and take your server to the next level!",
        reviews: [
          {
            id: 1,
            name: "Bruce Wayne",
            imagegreview: "{% static 'assets/Square.png' %}",
            rating: 4.7,
            date: "12-02-2024",
            review: "Insightful and practical",
          },
        ],
      };

      let visibleReviews = instructor.reviews.slice(0, 3);
      let showAll = false;

      // Populate instructor details
      document.getElementById("instructorImage").src = instructor.image;
      document.getElementById("instructorName").textContent = instructor.name;
      document.getElementById("instructorTitle").textContent = instructor.title;
      document.getElementById("instructorDescription").textContent =
        instructor.description;

      // Populate reviews
      const reviewsContainer = document.getElementById("reviewsContainer");
      const showAllButtonContainer = document.getElementById(
        "showAllButtonContainer"
      );

      function renderReviews(reviews) {
        reviewsContainer.innerHTML = ""; // Clear existing reviews
        reviews.forEach((review) => {
          const reviewHtml = `
        <div class="flex items-center space-x-4">
          <div class="w-14 h-14 flex-shrink-0 ">
            <img src="${review.imagegreview}" alt="${review.name}" class="rounded-full" />
          </div>
          <div>
            <div class="flex  space-x-4">
              <h4 class="text-lg font-bold text-green-600">${review.name}</h4>
              <h4 class="text-lg font-bold text-green-600">\(${review.rating})</h4>
              </div>
            <p class="text-sm text-gray-500">${review.date}</p>

            <p class="text-gray-800 mt-2">${review.review}</p>
          </div>
        </div>
      `;
          reviewsContainer.insertAdjacentHTML("beforeend", reviewHtml);
        });
      }

      function showAllReviews() {
        if (!showAll) {
          renderReviews(instructor.reviews);
          showAll = true;
          showAllButtonContainer.classList.add("hidden");
        }
      }

      // Initial render
      renderReviews(visibleReviews);
      if (instructor.reviews.length > visibleReviews.length) {
        showAllButtonContainer.classList.remove("hidden");
      }
    </script>
  </body>
</html>
