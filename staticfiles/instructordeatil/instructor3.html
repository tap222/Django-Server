<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Instructor</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- nav -->
    <nav class="bg-white">
      <div
        class="container mx-auto px-4 flex flex-wrap items-center justify-between lg:justify-evenly py-4"
      >
        <!-- Hamburger Menu for Small Screens -->
        <button
          id="menuToggle"
          class="text-gray-600 lg:hidden focus:outline-none"
          onclick="toggleMenu()"
        >
          <i id="menuIcon" class="fas fa-bars text-2xl"></i>
        </button>

        <!-- Navigation Links -->
        <div
          id="menu"
          class="absolute lg:static top-16 left-0 bg-white w-full lg:w-auto lg:flex lg:items-center lg:space-x-8 lg:py-0 hidden transition-all duration-300"
        >
          <a
            href="../index.html"
            class="block text-gray-600 hover:text-teal-500 py-2 px-4 lg:px-0"
            >Home</a
          >
          <a
            href="../OurTeacher.html"
            class="block text-gray-600 hover:text-teal-500 py-2 px-4 lg:px-0"
            >Our Teachers</a
          >
          <a
            href="../ScheduledEvents.html"
            class="block text-gray-600 hover:text-teal-500 py-2 px-4 lg:px-0"
            >Scheduled Events</a
          >
          <a
            href="../FAQs.html"
            class="block text-gray-600 hover:text-teal-500 py-2 px-4 lg:px-0"
            >FAQs</a
          >
        </div>

        <!-- Right-side icons -->
        <div class="flex items-center gap-4">
          <!-- Cart Icon -->
          <button class="text-gray-600 hover:text-teal-500 lg:hidden">
            <i class="fas fa-shopping-cart text-xl"></i>
          </button>
          <button class="text-gray-600 hover:text-teal-500 hidden lg:block">
            <i class="fas fa-shopping-cart text-xl"></i>
          </button>

          <!-- Sign In Button -->
          <a
            href="../Signin.html"
            class="lg:block py-2 ml-4 px-4 bg-teal-500 text-white rounded-lg font-medium hover:bg-teal-600"
          >
            Sign In
          </a>
        </div>
      </div>
    </nav>
    <div class="container mx-auto py-8">
      <div
        class="grid grid-cols-1 md:grid-cols-2 gap-8 bg-gray-100 p-6 pt-8 pb-12"
      >
        <div class="flex justify-center md:justify-start">
          <img
            id="instructorImage"
            class="w-full h-auto object-cover"
            src="../assests//i1.png"
            alt="Instructor Name"
          />
        </div>
        <div class="flex flex-col justify-center">
          <h1 id="instructorName" class="text-3xl font-bold text-gray-800"></h1>
          <p id="instructorTitle" class="text-xl text-gray-600 mt-2"></p>
          <div class="mt-6 text-gray-800 text-lg leading-relaxed">
            <p id="instructorDescription"></p>
          </div>
        </div>
      </div>

      <!-- Reviews Section -->
      <div class="py-12 px-8">
        <h2 class="text-3xl font-bold text-green-600 mb-6">Reviews</h2>
        <div id="reviewsContainer" class="space-y-6"></div>

        <!-- Show All Button -->
        <div id="showAllButtonContainer" class="text-center mt-6 hidden">
          <button
            onclick="showAllReviews()"
            class="px-4 py-2 bg-teal-500 text-white rounded-lg hover:bg-teal-600"
          >
            Show All Reviews
          </button>
        </div>
      </div>
    </div>

    <!-- footer -->
    <div class="bg-gray-100">
      <footer class="bg-teal-500 text-white py-8 pt-10">
        <!-- Links Section -->
        <div class="container mx-auto text-center">
          <div class="flex flex-wrap justify-center gap-3 mb-4 sm:gap-8">
            <a href="#about" class="hover:underline">About</a>
            <a href="#services" class="hover:underline">Services</a>
            <a href="#portfolio" class="hover:underline">Portfolio</a>
            <a href="#blogs" class="hover:underline">Blogs</a>
            <a href="#contact" class="hover:underline">Contact</a>
          </div>

          <!-- Social Media Links -->
          <div
            class="flex justify-center gap-6 text-xl mb-4 pt-6 pb-10 social-icons"
          >
            <a href="#" class="hover:text-gray-300" aria-label="Twitter">
              <i class="fab fa-twitter"></i>
            </a>
            <a href="#" class="hover:text-gray-300" aria-label="Instagram">
              <i class="fab fa-instagram"></i>
            </a>
            <a href="#" class="hover:text-gray-300" aria-label="Facebook">
              <i class="fab fa-facebook-f"></i>
            </a>
            <a href="#" class="hover:text-gray-300" aria-label="YouTube">
              <i class="fab fa-youtube"></i>
            </a>
          </div>

          <!-- Footer Text -->
          <p class="text-sm text-gray-200 border-t-2 border-t-gray-600 pt-4">
            © 2024 All rights reserved. This is Your Company
          </p>
        </div>
      </footer>
    </div>
    <script>
      function toggleMenu() {
        const menu = document.getElementById("menu");
        const menuIcon = document.getElementById("menuIcon");

        const isOpen = menu.classList.contains("hidden");
        if (isOpen) {
          menu.classList.remove("hidden");
          menu.classList.add("block", "shadow-lg", "py-4");
          menuIcon.classList.remove("fa-bars");
          menuIcon.classList.add("fa-times");
        } else {
          menu.classList.remove("block", "shadow-lg", "py-4");
          menu.classList.add("hidden");
          menuIcon.classList.remove("fa-times");
          menuIcon.classList.add("fa-bars");
        }
      }

      const instructor = {
        image: "../assests/i3.png",
        name: "Jane Cooper",
        title: "UI/UX Designer",
        description:
          "is a seasoned UI/UX designer with a passion for crafting...",
        reviews: [
          {
            id: 1,
            name: "Tony Stark",
            imagegreview: "../assests/Square.png",
            rating: 4.9,
            date: "20-12-2024",
            review: "Great course with practical examples for UI design!",
          },
        ],
      };

      let visibleReviews = instructor.reviews.slice(0, 3);
      let showAll = false;

      // Populate instructor details
      document.getElementById("instructorImage").src = instructor.image;
      document.getElementById("instructorName").textContent = instructor.name;
      document.getElementById("instructorTitle").textContent = instructor.title;
      document.getElementById("instructorDescription").textContent =
        instructor.description;

      // Populate reviews
      const reviewsContainer = document.getElementById("reviewsContainer");
      const showAllButtonContainer = document.getElementById(
        "showAllButtonContainer"
      );

      function renderReviews(reviews) {
        reviewsContainer.innerHTML = ""; // Clear existing reviews
        reviews.forEach((review) => {
          const reviewHtml = `
        <div class="flex items-center space-x-4">
          <div class="w-14 h-14 flex-shrink-0 ">
            <img src="${review.imagegreview}" alt="${review.name}" class="rounded-full" />
          </div>
          <div>
            <div class="flex  space-x-4">
              <h4 class="text-lg font-bold text-green-600">${review.name}</h4>
              <h4 class="text-lg font-bold text-green-600">\(${review.rating})</h4>
              </div>
            <p class="text-sm text-gray-500">${review.date}</p>

            <p class="text-gray-800 mt-2">${review.review}</p>
          </div>
        </div>
      `;
          reviewsContainer.insertAdjacentHTML("beforeend", reviewHtml);
        });
      }

      function showAllReviews() {
        if (!showAll) {
          renderReviews(instructor.reviews);
          showAll = true;
          showAllButtonContainer.classList.add("hidden");
        }
      }

      // Initial render
      renderReviews(visibleReviews);
      if (instructor.reviews.length > visibleReviews.length) {
        showAllButtonContainer.classList.remove("hidden");
      }
    </script>
  </body>
</html>
