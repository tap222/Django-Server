services:

  db:
    image: postgres:17
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/postgres_data
    env_file:
      - .env.prod

  
  django-web:
    build: .
    container_name: django-docker
    depends_on:
      - db
    volumes:
      - ./static:/app/staticfiles
      - media_files:/app/media
    env_file:
      - .env.prod
    
  frontend-proxy:
    image: nginx:latest
    ports:
      - "8001:80"
    volumes:
      - ./nginx/conf:/etc/nginx/conf:ro
      - ./static:/static:ro
      - media_files:/media:ro
    depends_on:
      - django-web
  volumes:
    postgres_data:
    media_files:
