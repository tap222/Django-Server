{% load static %}
{% load i18n %}
{% load account socialaccount %}

<nav class="bg-white">
  <div
    class="container mx-auto px-4 flex flex-wrap items-center justify-between lg:justify-evenly py-4"
  >
    <!-- Hamburger Menu for Small Screens -->
    <button
      id="menuToggle"
      class="text-gray-600 lg:hidden focus:outline-none"
      onclick="toggleMenu()"
    >
      <i id="menuIcon" class="fas fa-bars text-2xl"></i>
    </button>

    <!-- Navigation Links -->
    <div
      id="menu"
      class="absolute lg:static top-16 left-0 bg-white w-full lg:w-auto lg:flex lg:items-center lg:space-x-8 lg:py-0 hidden transition-all duration-300"
    >
        <a
        href="{% url 'base:home' %}"
        class="block text-gray-600 hover:text-teal-500 py-2 px-4 lg:px-0"
        >Home</a
      >
      <a
        href="{% url 'servers:application' %}"
        class="block text-gray-600 hover:text-teal-500 py-2 px-4 lg:px-0"
        >Server Apply</a
      >
      <a
        href="{% url 'teachers:application' %}"
        class="block text-gray-600 hover:text-teal-500 py-2 px-4 lg:px-0"
        >Teacher Apply</a
      >
      <a
        href="{% url 'events:events' %}"
        class="block text-gray-600 hover:text-teal-500 py-2 px-4 lg:px-0"
        >Events</a
      >
      <a
        href="{% url 'lessons:lessons' %}"
        class="block text-gray-600 hover:text-teal-500 py-2 px-4 lg:px-0"
        >Lessons</a
      >
      <a
        href="{% url 'base:faqs' %}"
        class="block text-gray-600 hover:text-teal-500 py-2 px-4 lg:px-0"
        >FAQs</a
      >
    </div>

    <!-- Right-side icons -->
    <div class="flex items-center gap-4">
      <!-- Sign In Button -->
      <div id="authButton" class="flex">
        {% if user.is_authenticated %}
          <a id='logOutButton'
            class="lg:block py-2 ml-4 mr-4 px-4 bg-teal-500 text-white rounded-lg font-medium hover:bg-teal-600"
            href="{% url 'account_logout' %}"
            >Log Out</a>
            <a
            href="{% url 'dashboard:dashboard' %}"
            class="lg:block py-2 ml-4 mr-4 px-4 bg-teal-500 text-white rounded-lg font-medium hover:bg-teal-600"
            >Dashboard</a>
        {% else  %}
          <a id='signInButton'
            {% comment %} href="{% url 'users:login' %}" {% endcomment %}
            href="{% provider_login_url 'discord' %}"
            class="lg:block py-2 ml-4 px-4 bg-teal-500 text-white rounded-lg font-medium hover:bg-teal-600"
            >Sign In<a>
        {% endif %}
      </div>
    </div>
  </div>
</nav>
<script>
  function navigateToInstructor1() {
    window.location.href = "./instructordeatil/instructor1.html";
  }
  function navigateToInstructor2() {
    window.location.href = "./instructordeatil/instructor2.html";
  }
  function navigateToInstructor3() {
    window.location.href = "./instructordeatil/instructor3.html";
  }
  function navigateToInstructor4() {
    window.location.href = "./instructordeatil/instructor4.html";
  }

  // Function to handle navigation to become an instructor
  function navigateToBecomeInstructor() {
    window.location.href = "/apply/server";
  }
  function toggleMenu() {
    const menu = document.getElementById("menu");
    const menuIcon = document.getElementById("menuIcon");

    const isOpen = menu.classList.contains("hidden");
    if (isOpen) {
      menu.classList.remove("hidden");
      menu.classList.add("block", "shadow-lg", "py-4");
      menuIcon.classList.remove("fa-bars");
      menuIcon.classList.add("fa-times");
    } else {
      menu.classList.remove("block", "shadow-lg", "py-4");
      menu.classList.add("hidden");
      menuIcon.classList.remove("fa-times");
      menuIcon.classList.add("fa-bars");
    }
  }
</script>
{% comment %} <script defer src="{% static, 'bundles/home.bundle.js' %}"></script> {% endcomment %}
